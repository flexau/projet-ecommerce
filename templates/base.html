{% load static %}
<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CDKBusness — découvrez des véhicules de qualité et contactez notre équipe à Kinshasa.">
  <title>{% block title %}CDKBusness — Roulez en grand{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<header class="site-header">
  <nav class="navbar navbar-expand-lg navbar-dark container py-3">
    <a class="navbar-brand" href="{% url 'core:home' %}">CDK<span>Busness</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-label="Ouvrir le menu"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">
        <li class="nav-item"><a class="nav-link active" href="{% url 'core:home' %}">Accueil</a></li>
        <li class="nav-item"><a class="nav-link" href="#catalogue">Catalogue</a></li>
        <li class="nav-item"><a class="nav-link" href="#apropos">À propos</a></li>
        <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
        <li class="nav-item"><a class="nav-link" href="#contact" aria-label="Mon compte"><i class="bi bi-person fs-5"></i></a></li>
      </ul>
    </div>
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
<footer class="site-footer" id="contact"><div class="container py-4 d-flex flex-column flex-md-row justify-content-between gap-2"><span class="navbar-brand">CDK<span>Busness</span></span><span>Votre prochain véhicule commence ici.</span><span>© {% now "Y" %} CDKBusness</span></div></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
